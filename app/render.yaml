services:
  - type: web
    name: hoteltruth
    runtime: node
    rootDir: app
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: APIFY_TOKEN
        sync: false
      - key: KIMI_API_KEY
        sync: false
